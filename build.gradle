plugins {
    alias libs.plugins.android.application apply false
    alias libs.plugins.android.library apply false
    // AGP 9 brings its own Kotlin plugin. Declaring KGP here without applying
    // it only bumps the version past the one AGP ships with. Do not apply
    // kotlin.android on top of it.
    alias libs.plugins.kotlin.android apply false
    alias libs.plugins.compose.compiler apply false
    alias libs.plugins.refine apply false
    alias libs.plugins.dependency.analysis
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }
}
