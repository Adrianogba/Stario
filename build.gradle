buildscript {
    ext.kotlin_version = '2.4.10'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.2'
        // AGP 9 applies Kotlin support itself; this classpath entry only raises
        // the bundled KGP above AGP's default. Do not apply kotlin.android.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'com.autonomousapps.dependency-analysis' version '3.18.0'
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }
}