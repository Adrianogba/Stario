[versions]
agp = "9.3.2"
kotlin = "2.4.10"
dependencyAnalysis = "3.19.1"
refine = "4.4.0"

activity = "1.13.0"
annotation = "1.10.0"
appcompat = "1.8.0"
asynclayoutinflater = "1.1.0"
compose = "1.12.0"
composeMaterial3 = "1.4.0"
constraintlayout = "2.2.2"
coordinatorlayout = "1.3.0"
core = "1.19.0"
customview = "1.2.0"
dynamicanimation = "1.1.0"
fragment = "1.9.0"
interpolator = "1.0.0"
lifecycle = "2.11.0"
localbroadcastmanager = "1.1.0"
palette = "1.0.0"
recyclerview = "1.4.0"
swiperefreshlayout = "1.2.0"
transition = "1.7.0"
viewpager = "1.1.0"

material = "1.14.0"
flexbox = "3.0.0"

carbon = "0.17.0"
squigglyslider = "1.0.0"
smarttablayout = "2.0.0"

gson = "2.14.0"
jsoup = "1.23.1"
okhttp = "5.5.0"
glide = "5.0.9"
glideTransformations = "4.3.0"
coroutines = "1.11.0"
jetbrainsAnnotations = "26.1.0"
rssparser = "6.1.8"

restrictionBypass = "c59bd6a680"
sunriseSunset = "1.2"
dateparser = "1.0.11"

junit = "4.13.2"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-appcompat-resources = { module = "androidx.appcompat:appcompat-resources", version.ref = "appcompat" }
androidx-asynclayoutinflater = { module = "androidx.asynclayoutinflater:asynclayoutinflater", version.ref = "asynclayoutinflater" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version.ref = "coordinatorlayout" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-customview = { module = "androidx.customview:customview", version.ref = "customview" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "dynamicanimation" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-interpolator = { module = "androidx.interpolator:interpolator", version.ref = "interpolator" }
androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "localbroadcastmanager" }
androidx-palette = { module = "androidx.palette:palette", version.ref = "palette" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-transition = { module = "androidx.transition:transition", version.ref = "transition" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "viewpager" }

compose-animation-core = { module = "androidx.compose.animation:animation-core", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose" }
compose-ui-unit = { module = "androidx.compose.ui:ui-unit", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3-android", version.ref = "composeMaterial3" }

google-material = { module = "com.google.android.material:material", version.ref = "material" }
google-flexbox = { module = "com.google.android.flexbox:flexbox", version.ref = "flexbox" }

# Unmaintained since 0.17.0 and the reason no Kotlin class here can extend a
# carbon widget. See the roadmap in the README.
carbon = { module = "tk.zielony:carbon", version.ref = "carbon" }
squigglyslider = { module = "me.saket.squigglyslider:squigglyslider", version.ref = "squigglyslider" }
smarttablayout = { module = "com.ogaclejapan.smarttablayout:library", version.ref = "smarttablayout" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-transformations = { module = "jp.wasabeef:glide-transformations", version.ref = "glideTransformations" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
rssparser = { module = "com.prof18.rssparser:rssparser", version.ref = "rssparser" }

refine-runtime = { module = "dev.rikka.tools.refine:runtime", version.ref = "refine" }
refine-annotation = { module = "dev.rikka.tools.refine:annotation", version.ref = "refine" }
refine-annotation-processor = { module = "dev.rikka.tools.refine:annotation-processor", version.ref = "refine" }

# Pinned to a commit: every tagged release fails to build on JitPack.
restriction-bypass = { module = "com.github.ChickenHook:RestrictionBypass", version.ref = "restrictionBypass" }
sunrise-sunset = { module = "com.luckycatlabs:SunriseSunsetCalculator", version.ref = "sunriseSunset" }
dateparser = { module = "com.github.sisyphsu:dateparser", version.ref = "dateparser" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
refine = { id = "dev.rikka.tools.refine", version.ref = "refine" }
